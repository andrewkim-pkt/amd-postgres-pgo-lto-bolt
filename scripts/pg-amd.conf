# postgresql.conf for the AMD r8a.metal-48xl HammerDB TPROC-C leg (192 cores, 1505 GB, 2 NUMA nodes).
#
# Sized per the published 48xl HammerDB configuration: shared_buffers 192GB on 1 GiB huge pages
# (201 pages reserved), max_wal_size 96GB / min 12GB, max_connections 1500.
# Every setting that SHAPES the workload is held identical to the published PG campaign so the
# AMD-vs-Intel comparison is not a configuration comparison:
#   synchronous_commit=off, full_page_writes=off, wal_level=minimal, wal_buffers=1GB,
#   checkpoint_timeout=30min, jit=off, planner costs, autovacuum, bgwriter_delay,
#   max_locks_per_transaction, data checksums on (PG 18 default).
listen_addresses = '*'
port = 5432
max_connections = 1500

shared_buffers = 192GB
effective_cache_size = 1100GB
huge_pages = on
huge_page_size = 1GB
work_mem = 8MB
maintenance_work_mem = 4GB

synchronous_commit = off
full_page_writes = off
wal_level = minimal
max_wal_senders = 0
wal_buffers = 1GB
max_wal_size = 96GB
min_wal_size = 12GB
checkpoint_timeout = 30min

random_page_cost = 1.0
seq_page_cost = 1.0
effective_io_concurrency = 200
jit = off

autovacuum_max_workers = 8
bgwriter_delay = 10ms
max_locks_per_transaction = 256

logging_collector = off
log_min_messages = warning
log_destination = 'stderr'
